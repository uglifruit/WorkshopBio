summary: |
  BioMimicry uses six mathematical physics engines to generate triggers, CV and
  audio that feel organically alive.<br><br>

  Tap the momentary switch to cycle six ecosystems. HORSES: a herd, each animal
  running its own stride clock driving four hooves at their real equine footfall
  offsets - walk, trot, canter and gallop as the actual biomechanical patterns,
  suspension phases and all. GEESE: a cascading probability network across a
  flock of twelve, where one honk spikes the odds for the rest. FROGS: the
  Kuramoto model of coupled oscillators, fighting between metronomic sync and
  chaotic swarms. RAIN: leaky integrate-and-fire buckets that fill with noise and
  splash downstream into each other when they overflow. METEORS: an
  inhomogeneous Poisson process where a hidden weather system swells a swarm from
  eerie silence into dense overlapping barrages. CICADAS: four patches of insects
  coupled on loudness rather than on phase or events, swelling out of step.<br><br>

  Voices are animal recordings with up to eight round robins each. In Horses
  the round robins are the four hooves, so a gait sounds like an animal rather
  than a drum machine.<br><br>

  Hold the momentary switch at power-on to boot DRONE, which granulates the same
  recordings into continuous texture instead of firing them as one-shots.<br><br>

  Samples can be replaced from a browser over USB.

panel:
  inputs:
    - id: AudioIn1
      name: Loudness
      type: audio
      description: An envelope follower on whatever you patch in, so the ecosystem hears the rest of your rack. A loud room agitates the geese into honking and shuts the cicadas up. Inactive when nothing is patched.
    - id: AudioIn2
      name: Disturb
      type: audio
      description: Transient-sensitive rather than level-sensitive, because sudden movement is what alarms an animal rather than steady noise. A sharp attack counts as a Spook. Inactive when nothing is patched.
    - id: CVIn1
      name: Physics Mod
      type: cv
      description: Summed with Knob Main to modulate the current ecosystem's physics variable
    - id: CVIn2
      name: Population Mod
      type: cv
      description: Summed with Knob X to modulate how many agents are active
    - id: PulseIn1
      name: Spook
      type: pulse
      description: Disrupts the environment. Horses - the herd startles into step. Geese - a guaranteed cascade. Frogs - a splash that scrambles every phase and destroys sync. Rain - a wind gust dumping energy into all the buckets. Meteors - a bolide spiking density to maximum. Cicadas - a footstep in the grass, silencing the field before it creeps back in.
    - id: PulseIn2
      name: Clock
      type: pulse
      description: An external tempo the ecosystem entrains to rather than obeys. Frogs treat it as a phantom oscillator and couple to its phase at whatever strength Knob Main sets, so the chorus dials from locked-to-clock to completely indifferent. Horses lock their stride, Geese lean honks toward the beat, Rain tops up the buckets, Meteors swell the debris field. Stops mattering about 3 seconds after the clock stops.
  outputs:
    - id: AudioOut1
      name: Audio L
      type: audio
      description: Agents rendered and placed in the stereo field by the mode's own logic - a stable image for Horses, fixed spots for the flock modes, a new position per hit for Rain and Meteors
    - id: AudioOut2
      name: Audio R
      type: audio
      description: The right channel of the same stereo image
    - id: CVOut1
      name: Trig3 / State
      type: cv
      description: A trigger or a continuous control voltage depending on the switch position - see the switch sections
    - id: CVOut2
      name: Trig4 / State
      type: cv
      description: A trigger or a continuous control voltage depending on the switch position - see the switch sections
    - id: PulseOut1
      name: Trig1 / All Trigs
      type: pulse
      description: Individual or summed agent triggers depending on the switch position
    - id: PulseOut2
      name: Trig2 / Accent
      type: pulse
      description: Individual agent triggers or an accent gate depending on the switch position

controls:
  switch:
    up:
      name: Discrete Routing
      description: The four agents route individually - agents 1 and 2 to the pulse outs, agents 3 and 4 as calibrated 5V trigger blips on the CV outs, since they have no pulse out of their own
    middle:
      name: Summed Routing
      description: All active agents OR'd onto Pulse Out 1, an accent on Pulse Out 2, and continuous internal-state CV on both CV outs
    down:
      name: WebUI mode/Alt Boot
      description: HOLD for WebUI mode. HOLD at power-on to boot DRONE mode instead of Rhythm - the LEDs announce which you got, Rhythm lighting the left column and Drone the right
    tap:
      name: Ecosystem
      description: Briefly press and release to move to the next ecosystem - Horses, Geese, Frogs, Rain, Meteors, Cicadas
  knobs:
    -
      main:
        name: Physics
        description: The fundamental law of the current ecosystem. Horses - gait and stride rate, sweeping walk, trot, canter and gallop with each gait in its own tempo band. Geese - contagion, from birds ignoring each other to one honk setting off the flock. Frogs - decoupling, from locked metronomic sync to total chaos. Rain - downpour, from silence to stuttering torrents. Meteors - debris density. Cicadas - coupling depth, from a steady drone to deep irregular surges.
      x:
        name: Population
        description: How many agents are alive, 1 to 4. Horses always keep all four hooves - the knob adds whole animals to the herd. In the swarm modes each output channel carries three members, so a full population is twelve birds, frogs, meteors or insects.
      y:
        name: Chaos
        description: Per-mode randomness and spread - per-hoof timing jitter (Horses), spontaneous spark rate (Geese), natural-frequency spread (Frogs), leak rate (Rain), density wander (Meteors), rate spread across the field (Cicadas). In Drone boot, the pitch spread across grains.
  leds:
    -
      display: list
      items:
        - id: LED0-5
          name: Ecosystem and Activity
          description: One LED per ecosystem, in order - Horses, Geese, Frogs, Rain, Meteors, Cicadas. The active mode's LED sits at a dim glow and flares to full on every trigger, so one light shows both which ecosystem is running and how busy it is. During the final write of a sample upload they show a stage count instead, so a failure reports where it stopped.

host:
  notes: |
    OUTPUTS BY SWITCH POSITION

    Switch Up (Discrete): Pulse Out 1 and 2 carry agents 1 and 2; CV Out 1 and 2
    fire agents 3 and 4 as calibrated 5V blips, because the Computer has only two
    pulse outs and every agent should get a physical trigger.

    Switch Middle (Summed): all agents OR'd onto Pulse Out 1, an accent on Pulse
    Out 2 when two or more agents hit at once, agent 1's continuous internal state
    on CV Out 1, and the whole-ecosystem state on CV Out 2.

    In DRONE boot the gates pair with the density of the texture they came from.
    Switch Up puts all activity on Pulse Out 1 with voice 1's density on CV Out 1;
    Switch Middle puts voices 1 and 2 on the two pulse outs with their densities
    on the two CV outs. The CV outs are always continuous in Drone.

    UNDER THE HOOD

    The physics engines run at a 1.5kHz control rate while voices, gates and CV
    run at the full 48kHz. Everything is integer fixed-point with no float in the
    hot path.

    SAMPLES

    Samples can be replaced over USB-MIDI from the web editor in Chrome or Edge:
    drag in WAVs, they are converted and loudness-matched in the browser and
    written to a reserved 1MB flash region. Uploads override the built-in
    recordings per slot, so one ecosystem can be replaced while the rest stay.

    The card keeps playing while it receives, then stops for the final write and
    reboots into the new samples. Writing flash halts execution and takes USB
    with it - the USB stack lives in flash - so a transfer is buffered in RAM and
    committed in one go. That caps a single upload at 128KB: one large recording
    or several small ones per pass.

    LICENCE - CC-BY-4.0 covers the card's own source: use, fork or sell it, just
    credit Andy Jenkinson (uglifruit). Two things are not mine to relicense and
    keep their own terms - the sample library is from Pixabay under the Pixabay
    Content License, and ComputerCard.h is Chris Johnson's, MIT.

    CREDITS - ComputerCard by Chris Johnson (Music Thing Modular). The Kuramoto
    model of coupled oscillators (Yoshiki Kuramoto); leaky integrate-and-fire and
    inhomogeneous Poisson processes are standard point-process models. Built with
    Claude Code.
